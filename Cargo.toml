[package]
name = "noodle"
version = "0.1.0"
edition = "2024"
# Benchmark targets are declared explicitly below so `benches/common.rs` stays a
# shared module instead of being picked up as a benchmark of its own.
autobenches = false

[[bin]]
name = "noodle"
path = "main.rs"

[lib]
name = "noodle"
path = "lib.rs"

[[bench]]
name = "inference"
path = "benches/inference.rs"
harness = false

[[bench]]
name = "training"
path = "benches/training.rs"
harness = false

[dependencies]
argh = "0.1"
burn = { version = "0.20", features = ["wgpu", "cuda", "ndarray", "autodiff", "train"] }
env_logger = "0.11"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.6"
ureq = "2"
wgpu = "24"

[dev-dependencies]
criterion = "0.8"
